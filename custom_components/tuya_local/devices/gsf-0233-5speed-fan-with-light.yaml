name: Ceiling fan switch with light
products:
  - id: 2nceiq4sa1tqov3d
    model: GSF-0233
entities:
  - entity: light
    dps:
      - id: 5
        name: switch
        type: boolean
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: speed
        mapping:
          - dps_val: "level_1"
            value: 10
          - dps_val: "level_2"
            value: 30
          - dps_val: "level_3"
            value: 50
          - dps_val: "level_4"
            value: 70
          - dps_val: "level_5"
            value: 100
  - entity: select
    translation_key: timer
    name: Fan timer
    category: config
    dps:
      - id: 2
        type: integer
        name: option
        mapping:
          - dps_val: 1800
            value: "1/2h"
          - dps_val: 3600
            value: "1h"
          - dps_val: 5400
            value: "11/2h"
          - dps_val: 7200
            value: "2h"
